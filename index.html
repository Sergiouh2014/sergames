<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La web de Sergio</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caja {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #0077cc;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="caja">
        <h1>🌍 Hola Mundo</h1>
        <p>Mi nombre es Sergio</p>
        <p>Bienvenido a Sergames</p>
    </div>

</body>
</html>
